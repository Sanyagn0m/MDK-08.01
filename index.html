<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>С Новым Годом!</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="scene">

    <!-- Гирлянда сверху -->
    <div class="garland">
      <span class="wire"></span>
      <div class="bulbs">
        <span class="bulb b1"></span>
        <span class="bulb b2"></span>
        <span class="bulb b3"></span>
        <span class="bulb b4"></span>
        <span class="bulb b5"></span>
        <span class="bulb b6"></span>
        <span class="bulb b7"></span>
        <span class="bulb b8"></span>
        <span class="bulb b9"></span>
      </div>
    </div>

    <!-- Поздравление -->
    <h1 class="greeting">
      <span>С</span><span class="space"></span><span>Н</span><span>о</span><span>в</span><span>ы</span><span>м</span>
      <span class="space"></span>
      <span>Г</span><span>о</span><span>д</span><span>о</span><span>м</span><span>!</span>
    </h1>
    <p class="subtitle">Пусть в доме будет тепло, а в сердце — сказка &#10084;</p>

    <!-- Камин -->
    <div class="fireplace">
      <div class="mantel">
        <!-- Нормальные носки -->
        <div class="stocking s1">
            <div class="heel"></div>
        </div>
        <div class="stocking s2">
            <div class="heel"></div>
        </div>
        <div class="stocking s3">
            <div class="heel"></div>
        </div>
        
        <div class="candle">
          <div class="flame-candle"></div>
        </div>
      </div>

      <div class="brick-wall">
        <div class="firebox">
          <div class="logs">
            <span class="log l1"></span>
            <span class="log l2"></span>
          </div>
          <!-- огонь -->
          <div class="fire">
            <span class="flame f-back"></span>
            <span class="flame f-mid"></span>
            <span class="flame f-front"></span>
            <span class="flame f-core"></span>
          </div>
          <div class="embers"></div>
          <div class="glow"></div>
        </div>
      </div>

      <div class="hearth"></div>
    </div>

    <!-- Ёлочка рядом -->
    <div class="tree">
      <div class="star">&#127775;</div>
      <div class="tier t1"></div>
      <div class="tier t2"></div>
      <div class="tier t3"></div>
      <div class="trunk"></div>
    </div>

    <!-- Вторая елочка-->
    <div class="tree2">
      <div class="star2">&#127775;</div>
      <div class="tier2 t4"></div>
      <div class="tier2 t5"></div>
      <div class="tier2 t6"></div>
      <div class="trunk2"></div>
    </div>

    <!-- Снег -->
    <div class="snow">
      <span class="flake f1"></span>
      <span class="flake f2"></span>
      <span class="flake f3"></span>
      <span class="flake f4"></span>
      <span class="flake f5"></span>
      <span class="flake f6"></span>
      <span class="flake f7"></span>
      <span class="flake f8"></span>
      <span class="flake f9"></span>
      <span class="flake f10"></span>
      <span class="flake f11"></span>
      <span class="flake f12"></span>
    </div>

  </div>
</body>
</html>
